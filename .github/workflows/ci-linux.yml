name: CI - Linux

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-linux:
    name: Test Linux Deployment & Validation Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install validation dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq desktop-file-utils

      - name: Validate Desktop Entry Spec
        run: |
          desktop-file-validate desktop/OpenRCT2.desktop

      - name: Run Makefile Validation Suite (make check)
        run: |
          make check

      - name: Test Real System Install (make install)
        run: |
          make install
          test -f "$HOME/.config/OpenRCT2/config.ini"
          test -f "$HOME/.config/OpenRCT2/shortcuts.json"
          test -f "$HOME/.local/share/applications/OpenRCT2.desktop"
          test -f "$HOME/.local/share/icons/openrct2.png"
          test -f "$HOME/.local/share/icons/hicolor/256x256/apps/openrct2.png"

      - name: Test Standalone Shell Script (setup.sh)
        run: |
          ./setup.sh

      - name: Test Clean Uninstallation (make uninstall)
        run: |
          make uninstall
          ! test -f "$HOME/.config/OpenRCT2/config.ini"
          ! test -f "$HOME/.config/OpenRCT2/shortcuts.json"
          ! test -f "$HOME/.local/share/applications/OpenRCT2.desktop"
