name: CI - macOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-macos:
    name: Test macOS Deployment & Validation Suite
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Makefile Validation Suite (make check)
        run: |
          make check

      - name: Test Real System Install (make install)
        run: |
          make install
          test -f "$HOME/Library/Application Support/OpenRCT2/config.ini"
          test -f "$HOME/Library/Application Support/OpenRCT2/shortcuts.json"

      - name: Test Standalone Shell Script (setup.sh)
        run: |
          ./setup.sh
          test -f "$HOME/Library/Application Support/OpenRCT2/config.ini"
          test -f "$HOME/Library/Application Support/OpenRCT2/shortcuts.json"

      - name: Test Clean Uninstallation (make uninstall)
        run: |
          make uninstall
          ! test -f "$HOME/Library/Application Support/OpenRCT2/config.ini"
          ! test -f "$HOME/Library/Application Support/OpenRCT2/shortcuts.json"
