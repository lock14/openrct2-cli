name: CI - Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-windows:
    name: Test Windows Deployment & Validation Suite
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate JSON Files
        shell: pwsh
        run: |
          Get-Content -Path "config\shortcuts.json" -Raw | ConvertFrom-Json | Out-Null
          Write-Host "shortcuts.json validated successfully."

      - name: Check Path Invariants
        shell: pwsh
        run: |
          $Forbidden = Select-String -Path "config\config.ini", "config\shortcuts.json" -Pattern "/home/[a-zA-Z0-9_-]+"
          if ($Forbidden) {
            Write-Error "Forbidden personal path found: $Forbidden"
            exit 1
          }
          Write-Host "Path invariants passed."

      - name: Test Default PowerShell Installation (setup.ps1)
        shell: pwsh
        run: |
          .\setup.ps1
          $DocsDir = Join-Path ([Environment]::GetFolderPath("MyDocuments")) "OpenRCT2"
          $ConfigFile = Join-Path $DocsDir "config.ini"
          $ShortcutsFile = Join-Path $DocsDir "shortcuts.json"

          if (-not (Test-Path $ConfigFile)) {
            Write-Error "config.ini was not installed to $ConfigFile"
            exit 1
          }
          if (-not (Test-Path $ShortcutsFile)) {
            Write-Error "shortcuts.json was not installed to $ShortcutsFile"
            exit 1
          }
          Write-Host "Default installation verified."

      - name: Test PowerShell Idempotency
        shell: pwsh
        run: |
          .\setup.ps1
          $DocsDir = Join-Path ([Environment]::GetFolderPath("MyDocuments")) "OpenRCT2"
          $Backups = Get-ChildItem -Path $DocsDir -Filter "*.bak.*"
          if ($Backups.Count -gt 0) {
            Write-Error "Idempotency failed: unexpected backup files created on identical run"
            exit 1
          }
          Write-Host "Idempotency verified."

      - name: Test Custom Directory Installation
        shell: pwsh
        run: |
          $CustomDir = Join-Path $env:RUNNER_TEMP "CustomOpenRCT2"
          .\setup.ps1 -CustomTargetDir $CustomDir
          if (-not (Test-Path (Join-Path $CustomDir "config.ini"))) {
            Write-Error "Custom directory installation failed for config.ini"
            exit 1
          }
          if (-not (Test-Path (Join-Path $CustomDir "shortcuts.json"))) {
            Write-Error "Custom directory installation failed for shortcuts.json"
            exit 1
          }
          Write-Host "Custom target directory installation verified."
